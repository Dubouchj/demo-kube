apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dubouchj/demo-kube.git
    targetRevision: main
    path: apps/demo-web
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-web
  # Sync manuel (démo) : après un push, l'app passe OutOfSync et
  # attend un clic sur SYNC dans l'interface Argo CD.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
