apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: php
          image: php:8.4-apache
          env:
            # Changer ces valeurs et pousser sur main : Argo CD relance les pods.
            - name: BG_COLOR
              value: "#1e6fd9"
            - name: APP_VERSION
              value: "v1"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /var/www/html/index.php
              subPath: index.php
      volumes:
        - name: app
          configMap:
            name: demo-web-php
