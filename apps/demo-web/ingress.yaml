apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.91-223-132-198.sslip.io
      secretName: demo-web-tls
  rules:
    - host: demo.91-223-132-198.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-web
                port:
                  name: http
