apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-web-php
data:
  index.php: |
    <?php
    $color = getenv('BG_COLOR') ?: '#1e6fd9';
    $version = getenv('APP_VERSION') ?: 'v1';
    ?>
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <title>Démo GitOps Hikube</title>
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            color: #fff;
            background: <?= htmlspecialchars($color) ?>;
          }
          .card {
            text-align: center;
            padding: 2rem 3rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
          }
          .php { font-size: 3rem; font-weight: 700; margin: 0.5rem 0; }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>Démo GitOps sur Hikube</h1>
          <p class="php">PHP <?= phpversion() ?></p>
          <p>Version applicative : <strong><?= htmlspecialchars($version) ?></strong></p>
          <p>Couleur de fond : <strong><?= htmlspecialchars($color) ?></strong></p>
          <p>Servi par le pod : <code><?= htmlspecialchars(gethostname()) ?></code></p>
        </div>
      </body>
    </html>
